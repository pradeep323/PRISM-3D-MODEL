<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM – Interactive 3D Prototype</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:#0b0f14;color:white;font-family:Arial,sans-serif;display:flex;flex-direction:column}
header{padding:22px 28px 12px;text-align:center} h1{margin:0 0 7px;font-size:28px} p{margin:0;color:#aeb8c4}
model-viewer{width:100%;flex:1;min-height:70vh;background:#111820;--poster-color:#111820}
.hint{text-align:center;padding:14px;color:#9ca8b5;font-size:14px}
</style>
</head>
<body>
<header><h1>PRISM — Interactive 3D Prototype</h1><p>Multi-Hazard Early-Warning Sensor Network</p></header>
<model-viewer
 src="PRISM.glb"
 orientation="-90deg 0deg 0deg"
 camera-orbit="0deg 75deg auto"
 camera-target="0m 0m 2.4m"
 camera-controls
 auto-rotate
 shadow-intensity="1"
 exposure="1"
 interaction-prompt="auto"
 alt="PRISM multi-hazard early-warning sensor node 3D model">
</model-viewer>
<div class="hint">Drag to rotate • Scroll/pinch to zoom • Use two fingers to pan</div>
</body></html>
